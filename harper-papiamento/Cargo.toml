[package]
name = "harper-papiamento"
version = "2.12.0"
edition = "2024"
description = "Papiamento (Aruba) dictionary and orthography rules for Harper."
license = "Apache-2.0"
publish = false
repository = "https://github.com/automattic/harper"

[dependencies]
# No default features, so that the WebAssembly build (which disables them) is not changed.
harper-core = { path = "../harper-core", version = "2.0.0", default-features = false }
hashbrown = "0.16.1"
serde_json = "1.0.150"
